name: Set up GTK4 and gtk4-layer-shell
description: >
  Install the GTK4 and gtk4-layer-shell development files. gtk4-layer-shell is
  only packaged from Ubuntu 24.10 on, so it is built from source when apt
  cannot supply it.

runs:
  using: composite
  steps:
    - name: Install GTK4
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-4-dev

    - name: Install gtk4-layer-shell
      shell: bash
      run: |
        if ! sudo apt-get install -y libgtk4-layer-shell-dev; then
          sudo apt-get install -y meson ninja-build libwayland-dev wayland-protocols gobject-introspection libgirepository1.0-dev valac
          git clone --depth 1 --branch v1.0.2 https://github.com/wmww/gtk4-layer-shell.git "$RUNNER_TEMP/gtk4-layer-shell"
          meson setup -Dexamples=false -Ddocs=false -Dtests=false --prefix=/usr "$RUNNER_TEMP/gtk4-layer-shell/build" "$RUNNER_TEMP/gtk4-layer-shell"
          ninja -C "$RUNNER_TEMP/gtk4-layer-shell/build"
          sudo ninja -C "$RUNNER_TEMP/gtk4-layer-shell/build" install
          sudo ldconfig
        fi
