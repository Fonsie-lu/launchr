version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      gtk-rs:
        patterns: ['gtk4*', 'gdk4*', 'gsk4*', 'glib*', 'gio*', 'cairo*', 'pango*', 'graphene*']
      wayland:
        patterns: ['wayland-*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
