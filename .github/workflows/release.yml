name: release

# Tag vX.Y.Z to publish, or run by hand with a tag that already exists to
# rebuild and re-upload its assets.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v0.1.0
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}
  TARGET: x86_64-unknown-linux-gnu

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: ./.github/actions/setup-gtk

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          name="launchr-$VERSION-$TARGET"
          mkdir "$name"
          cp target/release/launchr README.md "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber
          else
            gh release create "$TAG" "$ASSET" "$ASSET.sha256" --title "launchr $VERSION" --generate-notes
          fi
