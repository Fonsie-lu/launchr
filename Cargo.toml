[package]
name = "launchr"
version = "0.1.0"
edition = "2024"
# let chains and `slice::as_chunks`.
rust-version = "1.88"
description = "Wayland application launcher with popularity-based ranking"
license = "MIT"

[dependencies]
# 0.11.5 / 0.22.11: `AppInfo::executable` returns an `Option`, as the C API
# always could; the older bindings turned a NULL into a `PathBuf` regardless.
gtk4 = { version = "0.11.5", features = ["v4_12"] }
gtk4-layer-shell = "0.8.1"
wayland-client = "0.31.15"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
rustix = { version = "1.1", features = ["event", "fs", "mm"] }
serde = "1"
serde_json = "1"
# v2_58: launching with stdio of our choosing (`launch_uris_as_manager_with_fds`).
gio-unix = { version = "0.22.11", features = ["v2_58"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
